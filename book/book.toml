[book]
title = "Rust で数値計算"
authors = ["stovipf9"]
language = "ja"
src = "src"

[build]
# 既定は "book"。本のルートが book/ なので book/book になり、外側と内側の
# どちらを指しているのか読めなくなる。
build-dir = "html"

[output.html]
mathjax-support = true
git-repository-url = "https://github.com/stovipf9/numerics"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
